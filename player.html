<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ngaos Player - Neumorphism</title>
    <!-- Boxicons CDN -->
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    
    <style>
        /* =========================================
           PLAYER STYLES - Dark Neumorphism
           Ngaos Al Falah Ploso
           ========================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #1e222b;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: 100dvh;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }

        .background {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, #2a2f3d 0%, #1e222b 100%);
            z-index: 1;
        }

        /* Container Utama Player Neumorphic */
        .player-container {
            position: relative;
            width: 100%;
            max-width: 420px;
            background: #232732;
            border-radius: 40px;
            box-shadow: 12px 12px 24px #14161c, -12px -12px 24px #323848;
            padding: 30px;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        /* Status Bar Top (Badge Live & Session) */
        .top-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .live-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            background: #232732;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
            color: #ff5722;
            letter-spacing: 0.5px;
            box-shadow: inset 3px 3px 6px #14161c, inset -3px -3px 6px #323848;
        }

        .live-dot {
            width: 8px;
            height: 8px;
            background-color: #ff5722;
            border-radius: 50%;
            box-shadow: 0 0 8px #ff5722;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1); }
        }

        .user-status {
            font-size: 11px;
            color: #8a92a6;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Display Media (Frame Inset untuk Logo / Video Loop) */
        .media-display {
            position: relative;
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: #232732;
            box-shadow: inset 8px 8px 16px #14161c, inset -8px -8px 16px #323848;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            padding: 10px;
        }

        .media-content {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }

        /* Elemen tersembunyi */
        .hidden {
            display: none !important;
        }

        /* Info Judul & Subtitle */
        .track-info {
            text-align: center;
        }

        .track-info h1 {
            font-size: 18px;
            color: #fff;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .track-info .subtitle {
            font-size: 12px;
            color: #8a92a6;
            letter-spacing: 0.5px;
        }

        /* Timeline & Progress Bar */
        .progress-area {
            width: 100%;
        }

        .progress-bar-container {
            width: 100%;
            height: 10px;
            background: #232732;
            border-radius: 20px;
            box-shadow: inset 3px 3px 6px #14161c, inset -3px -3px 6px #323848;
            position: relative;
            cursor: pointer;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: #ff5722;
            border-radius: 20px;
            transition: width 0.1s linear;
        }

        .time-stamps {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: #8a92a6;
            margin-top: 8px;
        }

        /* Tombol Kontrol Player */
        .controls-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            width: 100%;
        }

        .btn-ctrl {
            background: #232732;
            border: none;
            outline: none;
            border-radius: 50%;
            color: #8a92a6;
            font-size: 18px;
            cursor: pointer;
            box-shadow: 6px 6px 12px #14161c, -6px -6px 12px #323848;
            transition: 0.2s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 48px;
            height: 48px;
            user-select: none;
            -webkit-user-select: none;
        }

        .btn-ctrl:active {
            box-shadow: inset 4px 4px 8px #14161c, inset -4px -4px 8px #323848;
            transform: scale(0.95);
            color: #ff5722;
        }

        /* Tombol Play Utama */
        .btn-ctrl.btn-play {
            width: 64px;
            height: 64px;
            font-size: 26px;
            color: #ff5722;
        }

        /* Dropdown Kecepatan Pemutaran */
        .speed-select {
            background: #232732;
            border: none;
            outline: none;
            color: #ff5722;
            font-size: 12px;
            font-weight: bold;
            padding: 8px 12px;
            border-radius: 15px;
            box-shadow: 4px 4px 8px #14161c, -4px -4px 8px #323848;
            cursor: pointer;
        }

        .speed-select option {
            background: #232732;
            color: #fff;
        }

        /* Responsivitas Mobile */
        @media screen and (max-width: 480px) {
            .player-container {
                padding: 24px 20px;
                border-radius: 30px;
            }

            .media-display {
                width: 170px;
                height: 170px;
            }
        }
    </style>
</head>
<body>
    <div class="background"></div>

    <div class="player-container">
        <!-- Top Bar Status -->
        <div class="top-bar">
            <div class="live-badge">
                <div class="live-dot"></div>
                <span>ON AIR</span>
            </div>
            <div class="user-status">
                <i class='bx bxs-user-check'></i>
                <span>Terverifikasi</span>
            </div>
        </div>

        <!-- Visual Display (Logo Statis / Video Loop 15s) -->
        <div class="media-display">
            <!-- Logo Statis (Tampil saat Pause) -->
            <img id="playerLogo" class="media-content" src="logo.png" alt="Logo Ngaos Al Falah Ploso">
            
            <!-- Video Loop 15 Detik (Tampil saat Play) -->
            <video id="playerVideo" class="media-content hidden" loop muted playsinline>
                <source src="video-loop.mp4" type="video/mp4">
            </video>
        </div>

        <!-- Info Siaran -->
        <div class="track-info">
            <h1>Ngaos Al Falah Ploso</h1>
            <p class="subtitle">Streaming Audio Pengajian Live</p>
        </div>

        <!-- Progress Bar & Durasi -->
        <div class="progress-area">
            <div class="progress-bar-container" id="progressContainer">
                <div class="progress-bar" id="progressBar"></div>
            </div>
            <div class="time-stamps">
                <span id="currentTime">00:00</span>
                <span id="duration">00:00</span>
            </div>
        </div>

        <!-- Kontrol Utama Player -->
        <div class="controls-row">
            <!-- Speed Selector -->
            <select id="speedSelect" class="speed-select" title="Kecepatan Pemutaran">
                <option value="0.75">0.75x</option>
                <option value="1" selected>1.0x</option>
                <option value="1.25">1.25x</option>
                <option value="1.5">1.5x</option>
            </select>

            <!-- Rewind Button (Hold Support) -->
            <button class="btn-ctrl" id="btnRewind" title="Mundur 10 detik">
                <i class='bx bx-rewind'></i>
            </button>

            <!-- Play / Pause Button -->
            <button class="btn-ctrl btn-play" id="btnPlay" title="Putar / Hentikan">
                <i class='bx bx-play' id="playIcon"></i>
            </button>

            <!-- Fast Forward Button (Hold Support) -->
            <button class="btn-ctrl" id="btnFF" title="Maju 10 detik">
                <i class='bx bx-fast-forward'></i>
            </button>
        </div>

        <!-- Audio Element Hidden -->
        <audio id="audioStream" src="audio-sample.mp3" preload="metadata"></audio>
    </div>

    <!-- Script pemutaran terpisah -->
    <script src="player.js"></script>
</body>
</html>
