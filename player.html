<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ngaos Al Falah Ploso - Live Audio Player</title>
    
    <!-- Google Fonts & Boxicons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">

    <style>
        :root {
            --bg-main: #0a0e14;
            --bg-gradient: radial-gradient(circle at 50% 0%, #132219 0%, #0a0e14 75%);
            --card-bg: rgba(18, 26, 20, 0.75);
            --card-border: rgba(234, 179, 8, 0.18);
            --accent-emerald: #10b981;
            --accent-gold: #eab308;
            --accent-gold-glow: rgba(234, 179, 8, 0.3);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --danger-color: #ef4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background: var(--bg-main);
            background-image: var(--bg-gradient);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            overflow-x: hidden;
        }

        /* CARD MAIN CONTAINER */
        .player-card {
            width: 100%;
            max-width: 440px;
            background: var(--card-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--card-border);
            border-radius: 32px;
            padding: 1.75rem;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), inset 0 1px 1px rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            transition: all 0.3s ease;
        }

        /* TOP USER BAR */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 0.65rem;
            background: rgba(255, 255, 255, 0.04);
            padding: 0.4rem 0.9rem 0.4rem 0.5rem;
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .avatar-icon {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-gold), #b45309);
            color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            font-weight: 700;
        }

        .username {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-primary);
            max-width: 130px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .btn-icon {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: var(--text-secondary);
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-icon:hover {
            background: rgba(239, 68, 68, 0.15);
            color: var(--danger-color);
            border-color: rgba(239, 68, 68, 0.3);
        }

        /* MEDIA DISPLAY (LOGO & VIDEO SWITCHER) */
        .media-wrapper {
            position: relative;
            width: 100%;
            max-width: 260px;
            aspect-ratio: 1 / 1;
            margin: 0 auto;
            border-radius: 28px;
            overflow: hidden;
            background: #0f172a;
            border: 2px solid rgba(234, 179, 8, 0.25);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            transition: all 0.4s ease;
        }

        .media-wrapper.playing {
            border-color: var(--accent-emerald);
            box-shadow: 0 0 35px rgba(16, 185, 129, 0.35);
        }

        .media-element {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: opacity 0.5s ease;
        }

        #liveVideo {
            display: none;
        }

        /* TRACK METADATA */
        .track-meta {
            text-align: center;
        }

        .app-title {
            font-size: 1.35rem;
            font-weight: 700;
            letter-spacing: -0.01em;
            margin-bottom: 0.25rem;
            color: var(--text-primary);
        }

        .app-sub {
            font-size: 0.85rem;
            color: var(--accent-gold);
            font-weight: 500;
        }

        /* STATUS BAR */
        .status-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(0, 0, 0, 0.3);
            padding: 0.75rem 1.15rem;
            border-radius: 18px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.05em;
        }

        .dot-live {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background-color: #64748b;
            transition: all 0.3s ease;
        }

        .dot-live.active {
            background-color: var(--accent-emerald);
            box-shadow: 0 0 10px var(--accent-emerald);
            animation: blink 1.5s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .stream-time {
            font-size: 0.85rem;
            font-weight: 600;
            font-family: monospace;
            color: var(--text-secondary);
        }

        .speed-badge {
            font-size: 0.75rem;
            background: rgba(234, 179, 8, 0.15);
            border: 1px solid rgba(234, 179, 8, 0.3);
            padding: 0.2rem 0.55rem;
            border-radius: 8px;
            color: var(--accent-gold);
            font-weight: 700;
        }

        /* CONTROLS */
        .controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1.5rem;
        }

        .btn-control-sub {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: var(--text-primary);
            font-size: 1.4rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .btn-control-sub:active {
            transform: scale(0.92);
        }

        .btn-play {
            width: 74px;
            height: 74px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-emerald), #059669);
            border: none;
            color: #ffffff;
            font-size: 2.4rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 25px rgba(16, 185, 129, 0.35);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-play:hover {
            transform: scale(1.05);
        }

        .btn-play:active {
            transform: scale(0.95);
        }

        .btn-play.playing {
            background: linear-gradient(135deg, var(--accent-gold), #d97706);
            color: #000000;
            box-shadow: 0 10px 25px var(--accent-gold-glow);
        }

        .btn-hint {
            font-size: 0.68rem;
            color: var(--text-secondary);
            text-align: center;
            margin-top: -0.25rem;
            opacity: 0.8;
        }

        /* =========================================================
           RESPONSIVE LANDSCAPE LAYOUT (DESKTOP / ROTATED DEVICES)
           ========================================================= */
        @media (orientation: landscape) and (min-height: 480px), (min-width: 850px) {
            body {
                padding: 2rem;
            }

            .player-card {
                max-width: 820px;
                display: grid;
                grid-template-columns: 300px 1fr;
                gap: 2rem;
                align-items: center;
                padding: 2.25rem;
            }

            .left-panel {
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
            }

            .right-panel {
                display: flex;
                flex-direction: column;
                gap: 1.25rem;
            }

            .media-wrapper {
                max-width: 280px;
                margin: 0;
            }

            .track-meta {
                text-align: left;
            }

            .btn-hint {
                text-align: left;
            }
        }
    </style>
</head>
<body>

    <div class="player-card">
        <!-- Panel Kiri (Media Display pada Landscape, Atas pada Portrait) -->
        <div class="left-panel">
            <div id="albumArt" class="media-wrapper">
                <!-- Logo Statis (Muncul saat Audio Diam/Pause) -->
                <img id="staticLogo" src="logo.png" alt="Logo Ngaos Al Falah Ploso" class="media-element">
                
                <!-- Video Visualizer (Muncul & Play saat Audio Berjalan) -->
                <video id="liveVideo" class="media-element" loop muted playsinline preload="auto">
                    <source src="visualizer.mp4" type="video/mp4">
                    Browser Anda tidak mendukung tag video.
                </video>
            </div>
        </div>

        <!-- Panel Kanan (Informasi & Kontrol) -->
        <div class="right-panel">
            <!-- Header Bar -->
            <div class="top-bar">
                <div class="user-info">
                    <div class="avatar-icon"><i class="bx bx-user"></i></div>
                    <span id="userDisplay" class="username">Guest User</span>
                </div>
                <button id="btnLogout" class="btn-icon" title="Keluar">
                    <i class="bx bx-log-out"></i>
                </button>
            </div>

            <!-- Metadata Info -->
            <div class="track-meta">
                <h1 id="appTitle" class="app-title">Ngaos Al Falah Ploso</h1>
                <p id="appSub" class="app-sub">Tafsir Jalalain & Shahih Bukhari</p>
            </div>

            <!-- Status Indicator -->
            <div class="status-container">
                <div class="status-badge">
                    <div id="dotLive" class="dot-live"></div>
                    <span id="statusIndicator">OFFLINE</span>
                </div>
                <span id="speedDisplay" class="speed-badge">1.0x</span>
                <span id="streamTime" class="stream-time">0:00</span>
            </div>

            <!-- Controls -->
            <div class="controls">
                <button id="btnRewind" class="btn-control-sub" title="Klik: Reset Speed | Tahan: Rewind 30s">
                    <i class="bx bx-rewind"></i>
                </button>

                <button id="playBtn" class="btn-play">
                    <i id="playIcon" class="bx bx-play"></i>
                </button>

                <button id="btnForward" class="btn-control-sub" title="Klik: Ganti Speed | Tahan: Catch-up Live">
                    <i class="bx bx-fast-forward"></i>
                </button>
            </div>
            <p class="btn-hint">Klik tombol samping untuk Kecepatan | Tahan untuk Replay/Live Sync</p>
        </div>
    </div>

    <!-- Script Utama Player -->
    <script src="player.js"></script>
</body>
</html>
