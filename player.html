<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ngaos Al Falah Ploso - Player</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        
        body { 
            background: #1e222b; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            min-height: 100dvh; 
            padding: 24px; 
            -webkit-user-select: none; 
            user-select: none; 
            overflow-x: hidden;
        }

        /* Base Container */
        .player-container {
            background: #232732; 
            width: 100%; 
            max-width: 360px;
            max-height: calc(100dvh - 48px);
            border-radius: 35px;
            padding: 25px 20px; 
            box-shadow: 10px 10px 20px #14161c, -10px -10px 20px #323848; 
            text-align: center; 
            margin: auto; 
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .player-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .live-badge { color: #ff5722; font-weight: bold; letter-spacing: 2px; font-size: 14px; }
        .btn-mini {
            background: #232732; border: none; width: 40px; height: 40px; border-radius: 50%;
            box-shadow: 4px 4px 8px #14161c, -4px -4px 8px #323848; cursor: pointer; display: flex; align-items: center; justify-content: center; position: relative;
        }
        
        .circle-outer {
            width: 170px; height: 170px; margin: 0 auto 10px auto; border-radius: 50%; background: #232732;
            display: flex; align-items: center; justify-content: center; box-shadow: inset 8px 8px 16px #14161c, inset -8px -8px 16px #323848;
            flex-shrink: 0;
        }
        .circle-inner {
            width: 120px; height: 120px; border-radius: 50%; overflow: hidden; border: 4px solid #1a1d24;
            box-shadow: 8px 8px 16px #14161c, -8px -8px 16px #323848; background: #232732; display: flex; align-items: center; justify-content: center;
        }
        .circle-inner img { width: 100%; height: 100%; object-fit: cover; display: block; border-radius: 50%; }
        
        /* Class Animasi Putar Piringan */
        .rotating { 
            -webkit-animation: spin 15s linear infinite; 
            animation: spin 15s linear infinite; 
        }
        @-webkit-keyframes spin { 100% { -webkit-transform: rotate(360deg); } }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        .radio-info h2 { color: #ffffff; font-size: 17px; margin-bottom: 4px; }
        .radio-info p { color: #8a92a6; font-size: 12px; margin-bottom: 6px; }
        .status-text { display: block; font-size: 12px; font-weight: 500; }
        .text-muted { color: #ffe0b2; }
        .text-connecting { color: #ffca28; }
        .text-live { color: #4caf50; font-weight: bold; }

        /* Audio Wave Visualizer */
        .audio-wave {
            display: flex;
            align-items: flex-end;
            justify-content: center;
            gap: 4px;
            height: 18px;
            margin-top: 4px;
            opacity: 0.3;
            transition: opacity 0.3s;
        }
        .audio-wave.active { opacity: 1; }
        .audio-wave span {
            width: 3px; background: #ff5722; border-radius: 3px; height: 4px;
        }
        .audio-wave.active span { animation: wave 0.8s ease-in-out infinite alternate; }
        .audio-wave.active span:nth-child(1) { animation-delay: 0.1s; }
        .audio-wave.active span:nth-child(2) { animation-delay: 0.3s; }
        .audio-wave.active span:nth-child(3) { animation-delay: 0.5s; }
        .audio-wave.active span:nth-child(4) { animation-delay: 0.2s; }
        .audio-wave.active span:nth-child(5) { animation-delay: 0.4s; }

        @keyframes wave {
            0% { height: 4px; }
            100% { height: 18px; }
        }

        .progress-container { display: flex; align-items: center; justify-content: space-between; margin: 10px 0; }
        .time-text { color: #8a92a6; font-size: 12px; }
        .live-text { color: #ff5722; font-weight: bold; }
        .slider-bar { flex: 1; height: 6px; background: #14161c; border-radius: 3px; margin: 0 12px; }
        .slider-fill { height: 100%; background: linear-gradient(90deg, #ff5722, #ff7043); border-radius: 3px; width: 0%; transition: width 0.2s ease; }

        .player-controls { display: flex; justify-content: space-evenly; align-items: center; margin-bottom: 10px; }
        .btn-control {
            background: #232732; border: none; width: 48px; height: 48px; border-radius: 50%;
            box-shadow: 5px 5px 10px #14161c, -5px -5px 10px #323848; cursor: pointer; display: flex; align-items: center; justify-content: center;
        }
        .btn-main {
            background: #ff5722; border: none; width: 65px; height: 65px; border-radius: 50%; 
            box-shadow: 6px 6px 12px #14161c, -6px -6px 12px #323848; cursor: pointer; display: flex; align-items: center; justify-content: center;
        }
        .btn-main:active, .btn-control:active { transform: scale(0.93); }
        
        /* Control Volume */
        .volume-container {
            display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 12px;
        }
        .volume-icon { color: #8a92a6; font-size: 16px; cursor: pointer; }
        .volume-slider {
            -webkit-appearance: none; appearance: none; width: 110px; height: 5px; border-radius: 3px; background: #14161c; outline: none;
        }
        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none; width: 14px; height: 14px; border-radius: 50%; background: #ff5722; cursor: pointer; box-shadow: 2px 2px 4px #14161c;
        }

        .logout-wrapper { text-align: center; }
        .btn-logout { background: #c62828; border: none; color: white; padding: 10px 25px; border-radius: 20px; font-weight: bold; font-size: 12px; cursor: pointer; box-shadow: 4px 4px 8px #14161c; width: 100%; max-width: 180px; }

        .svg-icon { width: 18px; height: 18px; fill: #ff5722; }
        .svg-icon-main { width: 24px; height: 24px; fill: #ffffff; }

        .info-card { display: none; position: absolute; top: 70px; right: 20px; background: #232732; width: 220px; padding: 15px; border-radius: 15px; box-shadow: 5px 5px 15px #14161c, -5px -5px 15px #323848; text-align: left; z-index: 10; border: 1px solid #323848; }
        .info-card p { color: #8a92a6; font-size: 11px; margin-bottom: 5px; line-height: 1.4; }
        .info-card p strong { color: #fff; }
    </style>
</head>
<body>

    <div class="player-container">
        <div class="player-header">
            <span class="live-badge">● LIVE</span>
            <button class="btn-mini" id="btnInfo" title="Informasi Aplikasi">
                <svg class="svg-icon" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
            </button>
        </div>

        <div class="info-card" id="infoCard">
            <p><strong>Aplikasi:</strong> Ngaos Al Falah Ploso</p>
            <p><strong>Status:</strong> Siaran Langsung</p>
            <p><strong>Fitur:</strong> Lockscreen Audio, Auto-Reconnect</p>
        </div>

        <div>
            <div class="circle-outer">
                <div class="circle-inner">
                    <img src="logo-alfalah.png" id="albumArt" alt="Logo Al Falah" onerror="this.src='https://via.placeholder.com/125/232732/ff5722?text=NGAOS'">
                </div>
            </div>

            <div class="radio-info">
                <h2 id="appTitle">NGAOS AL FALAH</h2>
                <p id="appDesc">TAFSIR JALALAIN & BUKHARI</p>
                <span class="status-text text-muted" id="statusIndicator">SIAP DIPUTAR</span>
                
                <div class="audio-wave" id="audioWave">
                    <span></span><span></span><span></span><span></span><span></span>
                </div>
            </div>
        </div>

        <div class="progress-container">
            <span class="time-text" id="streamTime">0:00</span>
            <div class="slider-bar"><div class="slider-fill" id="sliderFill"></div></div>
            <span class="live-text">LIVE</span>
        </div>

        <div class="player-controls">
            <button class="btn-control" id="btnRewind" title="Klik: Mundur 10s | Tahan: Replay 30s">
                <svg class="svg-icon" viewBox="0 0 24 24"><path d="M11 18V6l-8.5 6 8.5 6zm.5-6l8.5 6V6l-8.5 6z"/></svg>
            </button>
            <button class="btn-main" id="btnPlay">
                <svg class="svg-icon-main" id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            </button>
            <button class="btn-control" id="btnForward" title="Klik: Speed 1.25x | Tahan: Catch-up Live">
                <svg class="svg-icon" viewBox="0 0 24 24"><path d="M4 18l8.5-6L4 6v12zm9-12v12l8.5-6L13 6z"/></svg>
            </button>
        </div>

        <div class="volume-container">
            <span class="volume-icon" id="btnMute">🔊</span>
            <input type="range" class="volume-slider" id="volumeSlider" min="0" max="1" step="0.05" value="1">
        </div>

        <div class="logout-wrapper">
            <button class="btn-logout" id="btnLogout">KELUAR</button>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // Validasi Sesi Pengguna
            if (typeof Auth !== 'undefined' && !Auth.isSessionValid()) {
                window.location.href = typeof CONFIG !== 'undefined' ? CONFIG.LOGIN_PAGE : "index.html";
                return;
            }

            const STREAM_URL = (typeof CONFIG !== 'undefined' && CONFIG.STREAM_URL) ? CONFIG.STREAM_URL : "https://b.alhastream.com:5125/radio";
            let audio = null;
            let isPlaying = false;
            let reconnectAttempts = 0;
            let reconnectTimer = null;
            let timerInterval = null;
            let secondsElapsed = 0;

            const btnPlay = document.getElementById("btnPlay");
            const playIcon = document.getElementById("playIcon");
            const albumArt = document.getElementById("albumArt");
            const statusIndicator = document.getElementById("statusIndicator");
            const streamTime = document.getElementById("streamTime");
            const sliderFill = document.getElementById("sliderFill");
            const audioWave = document.getElementById("audioWave");
            const volumeSlider = document.getElementById("volumeSlider");
            const btnMute = document.getElementById("btnMute");
            const btnLogout = document.getElementById("btnLogout");
            const btnInfo = document.getElementById("btnInfo");
            const infoCard = document.getElementById("infoCard");

            // MEDIASESSION API (Layar Kunci HP Professional)
            function setupMediaSession() {
                if ('mediaSession' in navigator) {
                    navigator.mediaSession.metadata = new MediaMetadata({
                        title: typeof CONFIG !== 'undefined' ? CONFIG.APP_NAME : 'Ngaos Al Falah Ploso',
                        artist: typeof CONFIG !== 'undefined' ? CONFIG.APP_DESC : 'Radio Live Streaming',
                        album: 'Radio Kitab Kuning',
                        artwork: [
                            { src: 'logo-alfalah.png', sizes: '192x192', type: 'image/png' },
                            { src: 'logo-alfalah.png', sizes: '512x512', type: 'image/png' }
                        ]
                    });

                    navigator.mediaSession.setActionHandler('play', () => { if(!isPlaying) togglePlay(); });
                    navigator.mediaSession.setActionHandler('pause', () => { if(isPlaying) togglePlay(); });
                    navigator.mediaSession.setActionHandler('stop', () => { stopStreaming(); });
                }
            }

            function initAudio() {
                if (!audio) {
                    audio = new Audio();
                    audio.crossOrigin = "anonymous";
                    
                    audio.addEventListener("playing", () => {
                        isPlaying = true;
                        reconnectAttempts = 0;
                        statusIndicator.className = "status-text text-live";
                        statusIndicator.innerText = "● LIVE STREAMING";
                        albumArt.classList.add("rotating");
                        audioWave.classList.add("active");
                        sliderFill.style.width = "100%";
                        playIcon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
                        startTimer();
                        setupMediaSession();
                    });

                    audio.addEventListener("waiting", () => {
                        statusIndicator.className = "status-text text-connecting";
                        statusIndicator.innerText = "⏳ MENGHUBUNGKAN...";
                    });

                    audio.addEventListener("error", () => {
                        handleAutoReconnect();
                    });

                    audio.addEventListener("stalled", () => {
                        handleAutoReconnect();
                    });
                }
            }

            function handleAutoReconnect() {
                if (!isPlaying) return;
                reconnectAttempts++;
                const delay = Math.min(20000, reconnectAttempts * 3000);
                statusIndicator.className = "status-text text-connecting";
                statusIndicator.innerText = `🔄 KONEKSI TERPUTUS. MENCOBA (${reconnectAttempts})...`;

                clearTimeout(reconnectTimer);
                reconnectTimer = setTimeout(() => {
                    if (isPlaying && audio) {
                        audio.src = STREAM_URL + "?cb=" + Date.now();
                        audio.play().catch(() => {});
                    }
                }, delay);
            }

            function togglePlay() {
                initAudio();
                if (!isPlaying) {
                    statusIndicator.className = "status-text text-connecting";
                    statusIndicator.innerText = "⏳ MENGHUBUNGKAN...";
                    audio.src = STREAM_URL + "?cb=" + Date.now();
                    audio.play().catch(err => {
                        statusIndicator.className = "status-text text-muted";
                        statusIndicator.innerText = "❌ GAGAL MEMUTAR";
                    });
                } else {
                    stopStreaming();
                }
            }

            function stopStreaming() {
                isPlaying = false;
                clearTimeout(reconnectTimer);
                if (audio) {
                    audio.pause();
                    audio.src = "";
                }
                statusIndicator.className = "status-text text-muted";
                statusIndicator.innerText = "DITERHENTIKAN";
                albumArt.classList.remove("rotating");
                audioWave.classList.remove("active");
                sliderFill.style.width = "0%";
                playIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
                stopTimer();
            }

            function startTimer() {
                stopTimer();
                secondsElapsed = 0;
                timerInterval = setInterval(() => {
                    secondsElapsed++;
                    let mins = Math.floor(secondsElapsed / 60);
                    let secs = secondsElapsed % 60;
                    streamTime.innerText = `${mins}:${secs < 10 ? '0' : ''}${secs}`;
                }, 1000);
            }

            function stopTimer() {
                clearInterval(timerInterval);
                streamTime.innerText = "0:00";
            }

            // EVENT LISTENERS
            btnPlay.addEventListener("click", togglePlay);

            volumeSlider.addEventListener("input", (e) => {
                if (audio) audio.volume = e.target.value;
                btnMute.innerText = e.target.value == 0 ? "🔇" : "🔊";
            });

            btnMute.addEventListener("click", () => {
                if (audio) {
                    if (audio.volume > 0) {
                        audio.volume = 0;
                        volumeSlider.value = 0;
                        btnMute.innerText = "🔇";
                    } else {
                        audio.volume = 1;
                        volumeSlider.value = 1;
                        btnMute.innerText = "🔊";
                    }
                }
            });

            btnInfo.addEventListener("click", () => {
                infoCard.style.display = infoCard.style.display === "block" ? "none" : "block";
            });

            btnLogout.addEventListener("click", () => {
                stopStreaming();
                if (typeof Auth !== 'undefined') {
                    Auth.logout();
                } else {
                    window.location.href = "index.html";
                }
            });
        });
    </script>
</body>
</html>
