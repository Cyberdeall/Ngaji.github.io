<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ngaos Al Falah Ploso - Player</title>
    
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#1e222b">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        
        body { 
            background: #1e222b; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            min-height: 100dvh; 
            padding: 24px; 
            -webkit-user-select: none; 
            user-select: none; 
            overflow-x: hidden;
        }

        /* Base Container (Smartphone View - Presisi & Simetris) */
        .player-container {
            background: #232732; 
            width: 100%; 
            max-width: 360px;
            max-height: calc(100dvh - 48px);
            border-radius: 35px;
            padding: 25px 20px; 
            box-shadow: 10px 10px 20px #14161c, -10px -10px 20px #323848;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            position: relative;
        }

        /* Top Bar Header */
        .top-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #8a92a6;
            font-size: 13px;
            font-weight: 600;
        }

        .user-info i { color: #60a5fa; font-size: 16px; }

        .btn-logout {
            background: #232732;
            border: none;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            color: #ef4444;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 4px 4px 8px #14161c, -4px -4px 8px #323848;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.2s ease;
        }

        .btn-logout:active {
            box-shadow: inset 3px 3px 6px #14161c, inset -3px -3px 6px #323848;
        }

        /* Album Artwork Section */
        .album-art-container {
            position: relative;
            width: 170px;
            height: 170px;
            margin: 10px 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .album-art {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #232732;
            box-shadow: 8px 8px 16px #14161c, -8px -8px 16px #323848;
            transition: transform 0.5s ease;
        }

        .album-art.playing {
            animation: rotateAlbum 20s linear infinite;
        }

        @keyframes rotateAlbum {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Info Judul & Status */
        .track-info {
            text-align: center;
            margin-bottom: 10px;
            width: 100%;
        }

        .track-title {
            color: #ffffff;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .track-sub {
            color: #8a92a6;
            font-size: 12px;
            font-weight: 500;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(15, 23, 42, 0.6);
            padding: 4px 12px;
            border-radius: 20px;
            margin-top: 8px;
            font-size: 11px;
            color: #94a3b8;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .dot-live {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #64748b;
        }

        .dot-live.active {
            background: #22c55e;
            box-shadow: 0 0 8px #22c55e;
            animation: pulseDot 1.5s infinite;
        }

        @keyframes pulseDot {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        /* Timer Stream */
        .stream-timer {
            color: #60a5fa;
            font-size: 22px;
            font-weight: 700;
            margin: 8px 0;
            font-family: 'Courier New', Courier, monospace;
            letter-spacing: 1px;
        }

        /* Controller Buttons */
        .controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            width: 100%;
            margin-top: 5px;
        }

        .btn-ctrl {
            background: #232732;
            border: none;
            border-radius: 50%;
            color: #8a92a6;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 6px 6px 12px #14161c, -6px -6px 12px #323848;
            transition: all 0.2s ease;
        }

        .btn-ctrl:active {
            box-shadow: inset 4px 4px 8px #14161c, inset -4px -4px 8px #323848;
            color: #60a5fa;
        }

        .btn-small { width: 48px; height: 48px; font-size: 18px; }
        .btn-main { width: 68px; height: 68px; font-size: 26px; color: #60a5fa; }
        .btn-main.playing { color: #ef4444; }

        /* Speed Badge Indicator */
        .speed-badge {
            font-size: 10px;
            font-weight: 800;
            position: absolute;
            bottom: 4px;
            color: #60a5fa;
        }

        /* Helper Hidden */
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="player-container">
        <div class="top-bar">
            <div class="user-info">
                <i class='bx bxs-user-circle'></i>
                <span id="userDisplay">Pengguna</span>
            </div>
            <button class="btn-logout" id="btnLogout" title="Keluar">
                <i class='bx bx-log-out'></i>
            </button>
        </div>

        <div class="album-art-container">
            <img src="logo-alfalah.png" alt="Logo Al-Falah" class="album-art" id="albumArt">
        </div>

        <div class="track-info">
            <div class="track-title" id="appTitle">NGAOS AL FALAH PLOSO</div>
            <div class="track-sub" id="appSub">TAFSIR JALALAIN & SHAHIH BUKHARI</div>
            
            <div class="status-badge">
                <div class="dot-live" id="dotLive"></div>
                <span id="statusIndicator">OFFLINE</span>
            </div>
        </div>

        <div class="stream-timer" id="streamTime">0:00</div>

        <div class="controls">
            <button class="btn-ctrl btn-small" id="btnRewind" title="Klik: Reset Kecepatan | Tahan: Replay 30 Detik">
                <i class='bx bx-rewind'></i>
            </button>

            <button class="btn-ctrl btn-main" id="playBtn" title="Putar / Hentikan">
                <i class='bx bx-play' id="playIcon"></i>
            </button>

            <button class="btn-ctrl btn-small" id="btnForward" style="position: relative;" title="Klik: Ubah Kecepatan | Tahan: Live Catch-Up">
                <i class='bx bx-fast-forward'></i>
                <span class="speed-badge" id="speedDisplay">1.0x</span>
            </button>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/crypto.js"></script>
    <script src="js/auth.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // 1. PROTEKSI AKSES HALAMAN (WAJIB LOGIN)
            if (typeof Auth !== 'undefined' && !Auth.isSessionValid()) {
                window.location.href = CONFIG.LOGIN_PAGE || 'index.html';
                return;
            }

            // TAMPILKAN NAMA USER
            const session = Auth.getSession();
            const userDisplay = document.getElementById("userDisplay");
            if (session && session.username) {
                userDisplay.innerText = session.username;
            }

            // 2. ELEMEN UI PLAYER
            const playBtn = document.getElementById("playBtn");
            const playIcon = document.getElementById("playIcon");
            const albumArt = document.getElementById("albumArt");
            const dotLive = document.getElementById("dotLive");
            const statusIndicator = document.getElementById("statusIndicator");
            const streamTime = document.getElementById("streamTime");
            const speedDisplay = document.getElementById("speedDisplay");
            const btnLogout = document.getElementById("btnLogout");

            // ELEMEN INFORMASI TEKS DARI CONFIG
            if (typeof CONFIG !== 'undefined') {
                if (CONFIG.APP_NAME) document.getElementById("appTitle").innerText = CONFIG.APP_NAME;
                if (CONFIG.APP_DESC) document.getElementById("appSub").innerText = CONFIG.APP_DESC;
            }

            // 3. VARIABEL STATE PLAYER
            let audio = null;
            let isPlaying = false;
            let timerInterval = null;
            let secondsElapsed = 0;
            const speeds = [1.0, 1.25, 1.5, 2.0];
            let speedIndex = 0;

            const STREAM_URL = (typeof CONFIG !== 'undefined' && CONFIG.STREAM_URL) 
                ? CONFIG.STREAM_URL 
                : "https://b.alhastream.com:5125/radio";

            // 4. SETUP MEDIASESSION API (KONTROL LAYAR KUNCI HP)
            function setupMediaSession() {
                if ('mediaSession' in navigator) {
                    navigator.mediaSession.metadata = new MediaMetadata({
                        title: CONFIG.APP_NAME || 'Ngaos Al Falah Ploso',
                        artist: CONFIG.APP_DESC || 'Tafsir Jalalain & Shahih Bukhari',
                        album: 'Al Falah Ploso Kediri',
                        artwork: [
                            { src: 'icon-192.png', sizes: '192x192', type: 'image/png' },
                            { src: 'icon-512.png', sizes: '512x512', type: 'image/png' }
                        ]
                    });

                    navigator.mediaSession.setActionHandler('play', () => togglePlay());
                    navigator.mediaSession.setActionHandler('pause', () => togglePlay());
                    navigator.mediaSession.setActionHandler('stop', () => stopStreaming());
                }
            }

            // 5. MEMUTAR / MENGHENTIKAN STREAMING
            function togglePlay() {
                if (!isPlaying) {
                    startStreaming();
                } else {
                    stopStreaming();
                }
            }

            function startStreaming() {
                statusIndicator.innerText = "MENGHUBUNGKAN...";
                
                // Hancurkan objek lama jika ada
                if (audio) {
                    audio.pause();
                    audio.src = "";
                    audio = null;
                }

                // Inisialisasi Audio Baru dengan Anti-Cache Query
                audio = new Audio(STREAM_URL + "?cb=" + Date.now());
                audio.crossOrigin = "anonymous";
                audio.playbackRate = speeds[speedIndex];

                audio.play().then(() => {
                    isPlaying = true;
                    playIcon.className = "bx bx-pause";
                    playBtn.classList.add("playing");
                    albumArt.classList.add("playing");
                    dotLive.classList.add("active");
                    statusIndicator.innerText = "SIARAN LIVE";
                    
                    startTimer();
                    setupMediaSession();

                    if ('mediaSession' in navigator) {
                        navigator.mediaSession.playbackState = "playing";
                    }
                }).catch(err => {
                    console.error("Gagal memutar audio:", err);
                    stopStreaming();
                    statusIndicator.innerText = "GAGAL TERHUBUNG";
                });

                // AUTO-RECONNECT SAAT KONEKSI EROR
                audio.onerror = function() {
                    if (isPlaying) {
                        statusIndicator.innerText = "MENYAMBUNG KEMBALI...";
                        setTimeout(() => { if (isPlaying) startStreaming(); }, 3000);
                    }
                };
            }

            function stopStreaming() {
                if (audio) {
                    audio.pause();
                    audio.src = "";
                    audio = null;
                }
                isPlaying = false;
                playIcon.className = "bx bx-play";
                playBtn.classList.remove("playing");
                albumArt.classList.remove("playing");
                dotLive.classList.remove("active");
                statusIndicator.innerText = "OFFLINE";

                stopTimer();

                if ('mediaSession' in navigator) {
                    navigator.mediaSession.playbackState = "none";
                }
            }

            // 6. TIMER WAKTU MENDENGARKAN
            function startTimer() {
                stopTimer();
                secondsElapsed = 0;
                timerInterval = setInterval(() => {
                    secondsElapsed++;
                    let mins = Math.floor(secondsElapsed / 60);
                    let secs = secondsElapsed % 60;
                    streamTime.innerText = `${mins}:${secs < 10 ? '0' : ''}${secs}`;
                }, 1000);
            }

            function stopTimer() {
                if (timerInterval) clearInterval(timerInterval);
                streamTime.innerText = "0:00";
            }

            // 7. PENANGANAN DUA AKSI (KLIK BIASA VS TAHAN TOMBOL)
            function pasangFungsiDuaAksi(elemen, aksiKlik, aksiTahan) {
                let timerTahan = null;
                let sudahDiTahan = false;

                const mulai = () => {
                    sudahDiTahan = false;
                    timerTahan = setTimeout(() => {
                        sudahDiTahan = true;
                        if (aksiTahan) aksiTahan();
                    }, 600); // Tahan selama 600ms
                };

                const selesai = (e) => {
                    clearTimeout(timerTahan);
                    if (!sudahDiTahan) {
                        if (e.type === 'touchend') e.preventDefault();
                        if (aksiKlik) aksiKlik();
                    }
                };

                elemen.addEventListener('mousedown', mulai);
                elemen.addEventListener('mouseup', selesai);
                elemen.addEventListener('touchstart', mulai, { passive: true });
                elemen.addEventListener('touchend', selesai);
            }

            // TOMBOL REWIND (MUNDUR / RESET)
            pasangFungsiDuaAksi(
                document.getElementById("btnRewind"),
                function aksiKlik() {
                    speedIndex = 0;
                    if (audio) audio.playbackRate = speeds[speedIndex];
                    updateSpeedUI();
                },
                function aksiTahan() {
                    if (audio && isPlaying) {
                        audio.currentTime = Math.max(0, audio.currentTime - 30);
                        statusIndicator.innerText = "↩ REPLAY 30s";
                        setTimeout(() => { if (isPlaying) statusIndicator.innerText = "SIARAN LIVE"; }, 2000);
                    }
                }
            );

            // TOMBOL FORWARD (KECEPATAN / CATCH-UP)
            pasangFungsiDuaAksi(
                document.getElementById("btnForward"),
                function aksiKlik() {
                    speedIndex = (speedIndex + 1) % speeds.length;
                    if (audio) audio.playbackRate = speeds[speedIndex];
                    updateSpeedUI();
                },
                function aksiTahan() {
                    if (isPlaying) {
                        speedIndex = 0;
                        updateSpeedUI();
                        startStreaming(); // Catch-up langsung ke live stream terbaru
                        statusIndicator.innerText = "⚡ CATCH-UP LIVE";
                    }
                }
            );

            function updateSpeedUI() {
                speedDisplay.innerText = speeds[speedIndex] + "x";
            }

            // 8. EVENT LISTENER TOMBOL UTAMA
            playBtn.addEventListener("click", togglePlay);

            btnLogout.addEventListener("click", function() {
                if (confirm("Apakah Anda yakin ingin keluar dari aplikasi?")) {
                    stopStreaming();
                    if (typeof Auth !== 'undefined') {
                        Auth.logout();
                    } else {
                        localStorage.removeItem("radio_session");
                        window.location.href = "index.html";
                    }
                }
            });
        });

        // REGISTER SERVICE WORKER
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('SW Terdaftar di Player!', reg))
                    .catch(err => console.log('Gagal SW Player:', err));
            });
        }
    </script>
</body>
</html>
