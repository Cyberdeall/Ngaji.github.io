<!DOCTYPE html>
<html lang="id">
<head>
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#1e222b">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Ngaos Al Falah">
 
    <meta charset="UTF-8">
    <meta name="color-scheme" content="dark light">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NGAOS AL FALAH PLOSO - LOGIN & REGISTER</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    
    <script
      async
      crossorigin="anonymous"
      id="clerk-sdk"
      src="https://cdn.jsdelivr.net/npm/@clerk/clerk-js@latest/dist/clerk.browser.js">
    </script>

    <link rel="stylesheet" href="css/login.css">
</head>
<body>

    <div class="background"></div>

    <div class="container">
        <div class="form-box login">
            <form id="loginForm" novalidate>
                <div class="logo">
                    <img src="logo-alfalah.png" alt="Logo Al Falah" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                    <i class="bx bxs-radio" style="display:none;"></i>
                </div>
                <h1>NGAOS AL FALAH</h1>
                <p>Aplikasi Resmi Radio Kitab Kuning</p>
                <div class="input-box">
                    <input type="email" id="username" placeholder="Alamat Email" required autocomplete="username">
                    <i class='bx bxs-envelope'></i>
                </div>
                <div class="input-box">
                    <input type="password" id="password" placeholder="Kata Sandi" required autocomplete="current-password">
                    <i class='bx bxs-lock-alt toggle-password' title="Tampilkan/Sembunyikan Kata Sandi"></i>
                </div>
                <div class="options-box">
                    <label><input type="checkbox" id="remember"> Ingat Saya</label>
                    <a href="#" class="forgot-link" id="forgotPasswordBtn">Lupa Sandi?</a>
                </div>
                <div id="message" class="error-msg-container"></div>
                <button type="submit" class="btn" id="btnLogin">
                    <span class="btn-text">MASUK</span>
                    <span class="btn-spinner" style="display:none;"><i class="bx bx-loader-alt bx-spin"></i> Memproses...</span>
                </button>
            </form>
        </div>

        <div class="form-box register">
            <form id="registerForm" novalidate>
                <div class="logo">
                    <img src="logo-alfalah.png" alt="Logo Al Falah" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                    <i class="bx bxs-radio" style="display:none;"></i>
                </div>
                <h1>DAFTAR AKUN</h1>
                <p>Lengkapi Data Diri Anda</p>
                <div class="input-box">
                    <input type="email" id="regEmail" placeholder="Alamat Email" required autocomplete="email">
                    <i class='bx bxs-envelope'></i>
                </div>
                <div class="input-box">
                    <input type="text" id="regName" placeholder="Nama Lengkap" required autocomplete="name">
                    <i class='bx bxs-user'></i>
                </div>
                <div class="input-box">
                    <input type="password" id="regPassword" placeholder="Kata Sandi (Min. 8 Karakter)" required autocomplete="new-password">
                    <i class='bx bxs-lock-alt toggle-password' title="Tampilkan/Sembunyikan Kata Sandi"></i>
                </div>
                <div id="regMessage" class="error-msg-container"></div>
                <button type="submit" class="btn" id="btnRegister">
                    <span class="btn-text">DAFTAR</span>
                    <span class="btn-spinner" style="display:none;"><i class="bx bx-loader-alt bx-spin"></i> Memproses...</span>
                </button>
            </form>
        </div>

        <div class="toggle-box">
            <div class="toggle-panel toggle-left">
                <h1>Selamat Datang!</h1>
                <p>Belum memiliki akun Ngaos Al Falah Ploso?</p>
                <button class="btn register-btn">Daftar Akun</button>
            </div>

            <div class="toggle-panel toggle-right">
                <h1>Sampun Gadah Akun?</h1>
                <p>Silakan masuk jika Anda sudah terdaftar.</p>
                <button class="btn login-btn">Masuk</button>
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/crypto.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/login.js"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js')
            .then(reg => console.log('Service Worker terdaftar!', reg))
            .catch(err => console.log('Gagal mendaftarkan Service Worker:', err));
        });
      }
    </script>
</body>
</html>
