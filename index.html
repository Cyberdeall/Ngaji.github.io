<!DOCTYPE html>
<html lang="id">
<head>
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#1e222b">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Ngaos Al Falah">
 
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOGIN NGAOS AL FALAH PLOSO</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    
    <script
      async
      crossorigin="anonymous"
      id="clerk-sdk"
      src="https://cdn.jsdelivr.net/npm/@clerk/clerk-js@latest/dist/clerk.browser.js">
    </script>

    <link rel="stylesheet" href="css/login.css">
</head>
<body>

    <div class="background"></div>

    <div class="container">
        <div class="form-box login">
            <form id="loginForm">
                <div class="logo-container">
                    <img src="logo-alfalah.png" alt="Logo Al-Falah" class="app-logo">
                </div>
                <h1>Masuk</h1>
                
                <div class="input-box">
                    <input type="email" id="username" placeholder="Alamat Email" required autocomplete="email">
                    <i class='bx bxs-envelope'></i>
                </div>
                
                <div class="input-box">
                    <input type="password" id="password" placeholder="Kata Sandi" required autocomplete="current-password">
                    <i class='bx bxs-lock-alt'></i>
                    <i class='bx bx-hide toggle-pwd' data-target="password"></i>
                </div>

                <div class="forgot-link">
                    <label><input type="checkbox" id="remember"> Ingat Saya</label>
                </div>

                <div id="message" class="alert-box"></div>

                <button type="submit" class="btn" id="btnLogin">
                    <span class="btn-text">Masuk</span>
                    <span class="btn-loader hidden"><i class="fas fa-spinner fa-spin"></i></span>
                </button>
            </form>
        </div>

        <div class="form-box register">
            <form id="registerForm">
                <div class="logo-container">
                    <img src="logo-alfalah.png" alt="Logo Al-Falah" class="app-logo">
                </div>
                <h1>Pendaftaran</h1>

                <div class="input-box">
                    <input type="text" id="regFullName" placeholder="Nama Lengkap" required autocomplete="name">
                    <i class='bx bxs-user'></i>
                </div>

                <div class="input-box">
                    <input type="email" id="regEmail" placeholder="Alamat Email" required autocomplete="email">
                    <i class='bx bxs-envelope'></i>
                </div>

                <div class="input-box">
                    <input type="password" id="regPassword" placeholder="Kata Sandi (Min. 8 karakter)" required autocomplete="new-password">
                    <i class='bx bxs-lock-alt'></i>
                    <i class='bx bx-hide toggle-pwd' data-target="regPassword"></i>
                </div>

                <div id="regMessage" class="alert-box"></div>

                <button type="submit" class="btn" id="btnRegister">
                    <span class="btn-text">Daftar Akun</span>
                    <span class="btn-loader hidden"><i class="fas fa-spinner fa-spin"></i></span>
                </button>
            </form>
        </div>

        <div class="toggle-box">
            <div class="toggle-panel toggle-left">
                <h1>Selamat Datang!</h1>
                <p>Belum memiliki akun Ngaos Al Falah Ploso?</p>
                <button class="btn register-btn">Daftar Akun</button>
            </div>

            <div class="toggle-panel toggle-right">
                <h1>Sampun Gadah Akun?</h1>
                <p>Silakan masuk jika Anda sudah terdaftar.</p>
                <button class="btn login-btn">Masuk</button>
            </div>
        </div>
    </div>

    <div id="otpModal" class="modal-overlay hidden">
        <div class="modal-card">
            <i class='bx bx-mail-send modal-icon'></i>
            <h2>Verifikasi Email</h2>
            <p>Kode OTP 6-digit telah dikirimkan ke email Anda. Silakan periksa kotak masuk/spam.</p>
            
            <div class="otp-input-container">
                <input type="text" id="otpCode" maxlength="6" placeholder="000000" autocomplete="one-time-code">
            </div>

            <div id="otpMessage" class="alert-box"></div>

            <div class="modal-actions">
                <button id="btnVerifyOtp" class="btn">Verifikasi & Lanjut</button>
                <button id="btnCancelOtp" class="btn btn-secondary">Batal</button>
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/crypto.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/login.js"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js')
            .then(reg => console.log('Service Worker Terdaftar!', reg))
            .catch(err => console.log('Gagal daftar SW:', err));
        });
      }
    </script>
</body>
</html>
